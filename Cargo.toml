[package]
name = "vaultty"
version = "0.22.0"
edition = "2024"

[dependencies]
base64 = "0.22"
axum = { version = "0.8.9", features = ["ws"] }
ecies = { version = "0.2", default-features = false, features = ["aes-rust", "std"] }
futures-util = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.29"
vt100 = "0.16.2"

[build-dependencies]
cc = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

[[bin]]
name = "vaultty-env"
path = "src/env/main.rs"

[[bin]]
name = "vaultty-sessiond"
path = "src/sessiond/main.rs"

[[bin]]
name = "vaultty-session-bridge"
path = "src/session_bridge/main.rs"

[[bin]]
name = "vaultty-relay"
path = "src/relay/main.rs"
