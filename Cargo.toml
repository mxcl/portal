[package]
name = "portal"
version = "0.22.0"
edition = "2024"

[dependencies]
base64 = "0.22"
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.29"
vt100 = "0.16.2"

[features]
test-peer-validation-bypass = []

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
security-framework = "3.7"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

[[bin]]
name = "portal-sessiond"
path = "src/sessiond/main.rs"

[[bin]]
name = "portal-session-bridge"
path = "src/session_bridge/main.rs"

[[bin]]
name = "portal-relay"
path = "src/relay/main.rs"
