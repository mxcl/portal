[package]
name = "portal-relay"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[dependencies]
anyhow = "1.0"
aes-gcm = "0.11.1"
axum = { version = "0.8.9", features = ["query"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
hmac = "0.13"
jsonwebtoken = { version = "11.0", features = ["rust_crypto"] }
reqwest = { version = "0.13.4", default-features = false, features = ["http2", "json", "query", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
sqlx = { version = "0.9.0", default-features = false, features = ["json", "sqlite", "runtime-tokio", "uuid"] }
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.18", features = ["serde", "v4"] }

[profile.release]
strip = true
lto = "thin"
